# Reference copy of the /whos-hacking-me blocks in /etc/nginx/sites-available/default.
# Not included by nginx; edit the live file and copy changes back here.

# --- port 80 server block ---
	location /whos-hacking-me {
		return 301 https://scratchbuild.net$request_uri;
	}
	location /www-traffic {
		return 301 https://scratchbuild.net/whos-hacking-me/;
	}

# --- HTTPS server block ---
	# Who's Hacking Me visitor log: public by the owner's choice; shows real visitors' IP addresses.
	location /whos-hacking-me {
		access_log off;
		limit_req zone=hackingfeed burst=20 nodelay;
		client_max_body_size 1m;
		proxy_pass http://127.0.0.1:5002;
		proxy_set_header Host $host;
	}
	location /www-traffic {
		access_log off;
		return 301 /whos-hacking-me/;
	}
